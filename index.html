/* ===== NAV ===== */
#navbar{position:fixed;top:3px;left:0;right:0;z-index:1000;background:rgba(255,255,255,0.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:box-shadow .3s,background .3s;}
[data-theme="dark"] #navbar{background:rgba(13,17,23,0.93);}
#navbar.scrolled{box-shadow:0 4px 24px rgba(30,58,138,0.1);}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 2rem;height:68px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{display:flex;align-items:center;gap:.6rem;}
.nav-brand-icon{width:38px;height:38px;background:var(--blue-800);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.nav-brand-name{font-size:1.15rem;font-weight:800;color:var(--blue-800);letter-spacing:-.02em;}
[data-theme="dark"] .nav-brand-name{color:var(--blue-500);}
.nav-links{display:flex;align-items:center;gap:.25rem;list-style:none;}
.nav-links a{display:block;padding:.45rem .9rem;font-size:.9rem;font-weight:500;color:var(--text-2);border-radius:6px;transition:color .2s,background .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--blue-800);background:var(--blue-50);}
[data-theme="dark"] .nav-links a:hover,[data-theme="dark"] .nav-links a.active{color:var(--blue-500);}
.nav-links a.active{font-weight:600;}
.nav-cta{background:var(--blue-800)!important;color:#fff!important;padding:.55rem 1.25rem!important;border-radius:6px!important;font-weight:700!important;transition:background .2s,transform .15s!important;}
.nav-cta:hover{background:var(--blue-700)!important;transform:translateY(-1px);}

/* Dark mode toggle */
.theme-toggle{width:36px;height:36px;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:background .2s,border-color .2s,transform .15s;cursor:pointer;flex-shrink:0;}
.theme-toggle:hover{transform:translateY(-1px);border-color:var(--blue-300,#93c5fd);}
.nav-right{display:flex;align-items:center;gap:.75rem;}

.nav-ham{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:6px;border-radius:6px;}
.nav-ham span{display:block;width:24px;height:2px;background:var(--blue-800);border-radius:2px;transition:transform .3s,opacity .3s;}
[data-theme="dark"] .nav-ham span{background:var(--blue-400);}
.nav-ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.nav-ham.open span:nth-child(2){opacity:0;}
.nav-ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.nav-mob{display:none;flex-direction:column;background:var(--bg);border-top:1px solid var(--border);padding:1rem 2rem 1.5rem;gap:.25rem;}
.nav-mob a{display:block;padding:.65rem .75rem;font-size:1rem;font-weight:500;color:var(--text-2);border-radius:6px;transition:color .2s,background .2s;}
.nav-mob a:hover{color:var(--blue-800);background:var(--blue-50);}
.nav-mob.open{display:flex;}
